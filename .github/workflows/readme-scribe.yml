name: Update README

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - ".github/workflows/readme-scribe.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README from public GitHub APIs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-readme.py

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update generated README
          branch: main
          file_pattern: README.md
